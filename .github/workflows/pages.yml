name: Publish content catalog

on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Yayınlanacak koleksiyon'
        type: choice
        default: all
        options:
          - all
          - dini

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Complete the source site's omitted intermediate chain
        run: |
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -untrusted certs/root-yr-by-x1.pem certs/int-yr2.pem
          cat /etc/ssl/certs/ca-certificates.crt certs/int-yr2.pem certs/root-yr-by-x1.pem > "$RUNNER_TEMP/source-ca-bundle.pem"
          echo "CURL_CA_BUNDLE=$RUNNER_TEMP/source-ca-bundle.pem" >> "$GITHUB_ENV"
      - name: Require written redistribution permission
        if: inputs.collection != 'dini'
        env:
          CONTENT_LICENSE_TEXT: ${{ secrets.CONTENT_LICENSE_TEXT }}
        run: |
          if [ -z "$CONTENT_LICENSE_TEXT" ]; then
            echo "CONTENT_LICENSE_TEXT secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$CONTENT_LICENSE_TEXT" > "$RUNNER_TEMP/content-license.txt"
          CONTENT_LICENSE_FILE="$RUNNER_TEMP/content-license.txt" npm run publish:check
      - run: npm ci
      - run: npm run ingest:all
        if: inputs.collection != 'dini'
      - run: npm run restore:published
        if: inputs.collection == 'dini'
      - run: npm run ingest:dini
      - run: npm run verify:dini
      - run: npm run verify:all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
